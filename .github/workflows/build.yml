name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests (protocol conformance, pairing, input, and the real program end to end)
        # The runner has no GPU or desktop to capture, so the end-to-end test skips only the picture.
        env:
          SILL_E2E_NO_VIDEO: "1"
        run: cargo test --release --features sound -- --nocapture
      - name: Build SillHost.exe, without sound, as the downloads are
        run: cargo build --release
      - name: Smoke test the built program
        shell: pwsh
        run: |
          $out = & target\release\SillHost.exe --help
          if ($LASTEXITCODE -ne 0 -or -not ($out -match "SillHost")) { throw "SillHost.exe --help failed" }
          $out
      - name: Real clicks, typing and menus on this machine's desktop
        # Allowed to fail the build: it passes on GitHub's runner, and a failure here is a real one.
        env:
          SILL_E2E_INPUT: "1"
          SILL_E2E_NO_VIDEO: "1"
        run: cargo test --release --test end_to_end on_windows -- --nocapture --test-threads=1
      - name: Picture check (shows how far a machine with no GPU gets)
        continue-on-error: true
        env:
          SILL_HOME: ${{ runner.temp }}\check
        run: target\release\SillHost.exe --check
      - name: Pair window, photographed and its QR code scanned
        continue-on-error: true
        shell: pwsh
        env:
          SILL_HOME: ${{ runner.temp }}\pair
        run: |
          # Leave the window behind everything else to prove it comes to the front by itself.
          $p = Start-Process target\release\SillHost.exe -ArgumentList '--port','17999','--name','CI-PC' -PassThru -RedirectStandardOutput pair-out.txt -RedirectStandardError pair-err.txt
          Start-Sleep 6
          pip install --quiet zeroconf
          python tests/bonjour_probe.py
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width,$b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Left,$b.Top,0,0,$bmp.Size)
          $bmp.Save("pair-window.png")
          Stop-Process $p
          Get-Content pair-out.txt,pair-err.txt | Select-String -NotMatch '107m'
          pip install --quiet opencv-python-headless
          python -c "import cv2,sys; t,_,_=cv2.QRCodeDetector().detectAndDecode(cv2.imread('pair-window.png')); print('QR says:', t[:24]+'…' if t else 'nothing found'); sys.exit(0 if t.startswith('sill://pair') else 1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pair-window-photo
          path: pair-window.png
          if-no-files-found: ignore
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\SillHost.exe dist\
          Copy-Item README.md dist\README.txt
          Copy-Item LICENSE dist\LICENSE.txt
          Copy-Item THIRD-PARTY-NOTICES.txt dist\THIRD-PARTY-NOTICES.txt
      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\sill.iss
          Copy-Item installer\Output\SillSetup.exe dist\SillSetup.exe
      - name: Try the installer, for real
        shell: pwsh
        run: |
          Start-Process dist\SillSetup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $exe = 'C:\Program Files\Sill for Windows\SillHost.exe'
          if (-not (Test-Path $exe)) { throw 'SillHost.exe was not installed' }
          & $exe --help | Select-Object -First 1
          netsh advfirewall firewall show rule name="Sill for Windows" | Select-String 'Enabled|Direction|Action|Profiles|Program'
          if ($LASTEXITCODE -ne 0) { throw 'no firewall rule' }
          Start-Process 'C:\Program Files\Sill for Windows\unins000.exe' -ArgumentList '/VERYSILENT' -Wait
          Start-Sleep 3
          if (Test-Path $exe) { throw 'uninstall left the program behind' }
          netsh advfirewall firewall show rule name="Sill for Windows" | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'uninstall left the firewall rule behind' }
          $global:LASTEXITCODE = 0
          'Installed and uninstalled cleanly.'
      - uses: actions/upload-artifact@v4
        with:
          name: SillHost-windows
          path: dist/
          if-no-files-found: error
      - name: Publish the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist\SillSetup.exe dist\SillHost.exe --title "Sill for Windows $env:GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md
