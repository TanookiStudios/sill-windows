name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests (protocol conformance, pairing, input, and the real program end to end)
        # The runner has no GPU or desktop to capture, so the end-to-end test skips only the picture.
        env:
          SILL_E2E_NO_VIDEO: "1"
        run: cargo test --release -- --nocapture
      - name: Build SillHost.exe
        run: cargo build --release
      - name: Smoke test the built program
        shell: pwsh
        run: |
          $out = & target\release\SillHost.exe --help
          if ($LASTEXITCODE -ne 0 -or -not ($out -match "SillHost")) { throw "SillHost.exe --help failed" }
          $out
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\SillHost.exe dist\
          Copy-Item README.md dist\README.txt
          Copy-Item LICENSE dist\LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SillHost-windows
          path: dist/
          if-no-files-found: error
