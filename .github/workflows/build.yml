name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests (protocol conformance, pairing, input, and the real program end to end)
        # The runner has no GPU or desktop to capture, so the end-to-end test skips only the picture.
        env:
          SILL_E2E_NO_VIDEO: "1"
        run: cargo test --release -- --nocapture
      - name: Build SillHost.exe
        run: cargo build --release
      - name: Smoke test the built program
        shell: pwsh
        run: |
          $out = & target\release\SillHost.exe --help
          if ($LASTEXITCODE -ne 0 -or -not ($out -match "SillHost")) { throw "SillHost.exe --help failed" }
          $out
      - name: Real clicks and typing on this machine's desktop
        continue-on-error: true
        env:
          SILL_E2E_INPUT: "1"
          SILL_E2E_NO_VIDEO: "1"
        run: cargo test --release --test end_to_end input_lands_on_windows -- --nocapture
      - name: Picture check (shows how far a machine with no GPU gets)
        continue-on-error: true
        env:
          SILL_HOME: ${{ runner.temp }}\check
        run: target\release\SillHost.exe --check
      - name: Pair window, photographed and its QR code scanned
        continue-on-error: true
        shell: pwsh
        env:
          SILL_HOME: ${{ runner.temp }}\pair
        run: |
          # Leave the window behind everything else to prove it comes to the front by itself.
          $p = Start-Process target\release\SillHost.exe -ArgumentList '--port','17999','--name','CI PC' -PassThru -RedirectStandardOutput pair-out.txt -RedirectStandardError pair-err.txt
          Start-Sleep 6
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width,$b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Left,$b.Top,0,0,$bmp.Size)
          $bmp.Save("pair-window.png")
          Stop-Process $p
          Get-Content pair-out.txt | Select-String -NotMatch '107m'
          pip install --quiet opencv-python-headless
          python -c "import cv2,sys; t,_,_=cv2.QRCodeDetector().detectAndDecode(cv2.imread('pair-window.png')); print('QR says:', t[:24]+'…' if t else 'nothing found'); sys.exit(0 if t.startswith('sill://pair') else 1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pair-window-photo
          path: pair-window.png
          if-no-files-found: ignore
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\SillHost.exe dist\
          Copy-Item README.md dist\README.txt
          Copy-Item LICENSE dist\LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SillHost-windows
          path: dist/
          if-no-files-found: error
